{% extends "base.html" %}
{% block title %}Loyalty points{% endblock %}
{% block content %}
<div class="page-head"><h1>Manage points</h1></div>
<div class="card">
  <form method="post">{% csrf_token %}
    <div class="form-group"><label class="form-label">Points per ৳100</label>
      <input class="form-control" name="point_rate" value="{{ company.point_rate }}"></div>
    <div class="form-group"><label class="form-label">Taka value of 1 point</label>
      <input class="form-control" name="point_value" value="{{ company.point_value }}"></div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>
<div class="table-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Delta</th><th>Reason</th></tr></thead>
<tbody>{% for r in rows %}<tr><td>{{ r.customer }}</td><td class="num">{{ r.delta }}</td><td>{{ r.reason }}</td></tr>
{% empty %}<tr><td colspan="3">No point movements yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
