{% extends "base.html" %}
{% block title %}Product{% endblock %}
{% block crumb %}Product{% endblock %}
{% block content %}

<div class="page-head"><h1>{% if product %}Edit{% else %}Add{% endif %} product</h1></div>
<div class="card"><form method="post">{% csrf_token %}
  {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  <button class="btn btn-primary" type="submit">Save</button>
</form></div>

{% endblock %}
