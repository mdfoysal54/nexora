{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block crumb %}{{ title }}{% endblock %}
{% block content %}

<div class="page-head"><h1>{{ title }}</h1></div>
<div class="card container-narrow"><form method="post">{% csrf_token %}
  {% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  <button class="btn btn-primary" type="submit">Save</button>
</form></div>

{% endblock %}
